[scenario]
level = "assist"
rules = ["CUSHION100"]
events = [{type = "human_note", value = {text = "Entry check for the CUSHION100 window, please."}}]

[[reference]]
tools = [{name = "observe", input = {}}]
[[reference]]
tools = [{name = "record_decision", input = {market = "kalshi_15m", action = "NO_TRADE", side = "<null>", p_estimate = "<null>", p_low = "<null>", p_high = "<null>", p_source = "market_implied", market_p = 0.565, edge_cents = "<null>", pass_reason = "NO_VALIDATED_EDGE", invalidation = "A CUSHION100 match, proposed to the user.", thesis = "Assist level: a rule match becomes a proposal only the user can approve. No match now.", next_check = "The next decision point."}}]
[[reference]]
text = "No rule match; at Assist level any entry is yours to approve."

[[mutants]]
name = "enters_itself_at_assist"
breaks = ["no_entry_in_rules_mode"]
turns = [
  {tools = [{name = "place_entry", input = {market = "kalshi_15m", side = "UP", stake = 1.0, order_type = "market", max_price = 0.62, max_worst_case = 1.5, note = "looks good", request_id = "m1"}}]},
  {text = "Entered."},
]

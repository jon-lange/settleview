name: Release

# A release: the owner tags a commit on main (python scripts/release.py prepare X.Y.Z; docs/operations.md, "Releases")
# and pushes the tag. This workflow builds the image from that commit for linux/amd64 + linux/arm64 (the same Dockerfile
# as CI, from scratch: the newest Debian security fixes, nothing from a cache), pushes it to the private GHCR package
# ghcr.io/jon-lange/settleview (tags X.Y.Z and sha-<short>, never `latest`), scans the pushed digest with Trivy (the
# quality gate's policy and .trivyignore), signs it with cosign keyless (GitHub's OIDC identity of this workflow) and
# attests each platform's CycloneDX SBOM, then makes the GitHub Release with the changelog's section, the digest, the
# verify command and the SBOMs. A deploy pins tag@digest and runs `cosign verify` first (docs/operations.md).
#
# Run by hand (workflow_dispatch): on a vX.Y.Z tag it rebuilds that release (a new digest with the day's security
# fixes; the notes are updated to it); on main it builds, scans and signs `sha-<short>` only (no Release), for a
# staging trial. Any other ref is refused. Main is not pushed on every commit (docs/operations.md, "Releases": the
# private package's storage, and a deploy should name a release).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Nothing by default: each job asks for what it needs, and only it.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jon-lange/settleview

# Actions are pinned by full commit SHA (the version in the comment), as in ci.yml; cosign by release, Trivy by digest
# (scripts/quality.py).

jobs:
  plan:
    name: What to build (tag, version, changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # origin/main: a release tag must be on it
          persist-credentials: false

      # A tag: vX.Y.Z, the same version in pyproject.toml, a CHANGELOG section for it, the commit on origin/main.
      # main: a sha-<short> image only. Anything else stops here.
      - name: Check the ref
        id: plan
        run: python3 scripts/release.py plan --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and push (linux/amd64 + linux/arm64)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write  # the push to GHCR; this job and the signing job only
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's tags, labels and annotations (docker/metadata-action): X.Y.Z from a vX.Y.Z tag, sha-<short> always,
      # never `latest`; the OCI source / revision / version labels link the package to this repository.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      # From scratch (pull, no-cache): the base digest is pinned, and the Dockerfile's `apt-get upgrade` layer then
      # takes the security fixes published up to today, not a cached day's. The digest output is the image index's.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          pull: true
          no-cache: true
          push: true
          provenance: mode=min
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest from the build"; exit 1; }
          { echo "Pushed \`$IMAGE@$DIGEST\`"; echo; echo "$TAGS"; } >> "$GITHUB_STEP_SUMMARY"

  scan:
    # The pushed digest itself, each platform read from GHCR: the quality gate's Trivy scan (fixable HIGH / CRITICAL
    # vulnerabilities and secrets, .trivyignore if any) fails the release before anything is signed. The same run
    # writes each platform's CycloneDX SBOM. Read-only on the package; no OIDC token here.
    name: Trivy (the pushed digest) and SBOMs
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # Trivy reads the private image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # The vulnerability database first, without the registry credentials below (they are for GHCR's private image,
      # not for the database's registries); the scans then find it fresh in the cache volume.
      - name: Download Trivy's database
        run: |
          trivy=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import quality; print(quality.TRIVY)')
          docker run --rm -v settleview-quality-trivy-cache:/root/.cache "$trivy" image --download-db-only --quiet

      - name: Trivy scan and SBOM, linux/amd64 and linux/arm64
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.plan.outputs.version }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=0
          for p in linux/amd64 linux/arm64; do
            arch="${p#linux/}"
            python3 scripts/quality.py --only trivy-image --image "$REF" --platform "$p" \
              --sbom "sbom/settleview-${VERSION}-linux-${arch}.cdx.json" || code=1
          done
          exit "$code"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  sign:
    # Keyless: cosign gets a short-lived certificate for this workflow's OIDC identity
    # (https://github.com/jon-lange/settleview/.github/workflows/release.yml@<ref>) from Sigstore's Fulcio and records
    # the signature in the public Rekor log (the identity, the commit and the digest are public there; nothing else).
    # The index digest is signed (what a deploy names), each platform's manifest too, and each platform's SBOM is
    # attested on its manifest. Then the same verify a deploy runs, so a release that cannot be verified fails here.
    name: Sign (cosign keyless) and attest the SBOMs
    needs: [plan, build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # the signatures and attestations are stored next to the image
      id-token: write  # GitHub's OIDC token for cosign keyless; this job only
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: sbom
          path: sbom

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image and attest the SBOMs
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          docker buildx imagetools inspect --raw "$ref" > /tmp/index.json
          for arch in amd64 arm64; do
            pd=$(python3 -c 'import json, sys; m = [x["digest"] for x in json.load(open("/tmp/index.json"))["manifests"] if x.get("platform", {}).get("os") == "linux" and x["platform"].get("architecture") == sys.argv[1]]; assert len(m) == 1, m; print(m[0])' "$arch")
            cosign sign --yes "$IMAGE@$pd"
            cosign attest --yes --type cyclonedx --predicate "sbom/settleview-${VERSION}-linux-${arch}.cdx.json" "$IMAGE@$pd"
            echo "linux/$arch: \`$IMAGE@$pd\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # The deploy's own check (docs/operations.md, "Deploy a release"): the identity is this workflow at this ref.
      - name: Verify as a deploy would
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" "$IMAGE@$DIGEST" > /dev/null
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > /tmp/index.json
          pd=$(python3 -c 'import json; print([x["digest"] for x in json.load(open("/tmp/index.json"))["manifests"] if x.get("platform", {}).get("architecture") == "amd64"][0])')
          cosign verify-attestation --type cyclonedx --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" "$IMAGE@$pd" > /dev/null
          echo "Verified: signed by \`$identity\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release (notes, digest, SBOMs)
    if: needs.plan.outputs.kind == 'release'
    needs: [plan, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the Release and upload its assets; this job only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: sbom
          path: sbom

      # A run by hand on an existing tag updates that Release (notes and SBOMs name the new digest).
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/release.py notes "$VERSION" --image "$IMAGE:$VERSION@$DIGEST" > /tmp/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" sbom/*.cdx.json --clobber
          else
            gh release create "$TAG" --verify-tag --title "Settleview $VERSION" --notes-file /tmp/notes.md sbom/*.cdx.json
          fi

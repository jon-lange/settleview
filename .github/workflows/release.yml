name: Release

# Releases are made by release-please (googleapis/release-please-action; release-please-config.json and
# .release-please-manifest.json): on every push to main it keeps one release PR open ("chore(main): release X.Y.Z")
# with the next version (from the Conventional Commits since the last release), pyproject.toml's and uv.lock's version
# and the CHANGELOG section. Merging that PR makes the tag vX.Y.Z and its GitHub Release (the changelog section as
# notes). Then, in this same run (a tag made with GITHUB_TOKEN starts no other workflow, as release-please documents),
# the image is built from that commit for linux/amd64 + linux/arm64 (the same Dockerfile as CI, from scratch: the
# newest Debian security fixes, nothing from a cache), pushed to the private GHCR package ghcr.io/jon-lange/settleview
# (tags X.Y.Z and sha-<short>, never `latest`), scanned with Trivy (the CI gate's policy and .trivyignore), signed
# with cosign keyless (GitHub's OIDC identity of this workflow) with each platform's CycloneDX SBOM attested, and the
# Release gets the digest, the verify command and the SBOMs. A deploy pins tag@digest and runs `cosign verify` first
# (docs/operations.md, "Releases and deploying by digest").
#
# Run by hand (workflow_dispatch): on a vX.Y.Z tag it rebuilds that release (a new digest with the day's security
# fixes; the Release's image section is replaced); on main it builds, scans and signs `sha-<short>` only (no
# Release), for a staging trial. Any other ref is refused. A push to main that releases nothing builds nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default: each job asks for what it needs, and only it.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jon-lange/settleview
  TRIVY_VERSION: v0.76.0  # as ci.yml

# Actions are pinned by full commit SHA (the version in the comment), as in ci.yml; cosign and Trivy by release.

jobs:
  release-please:
    # The release PR, and on its merge the tag and the GitHub Release. Only on a push to main.
    name: Release PR, tag and Release (release-please)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the release PR's branch, the tag and the Release
      pull-requests: write  # open and update the release PR
      issues: write  # the release PR's labels (autorelease: pending / tagged)
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    name: What to build (a release, main, or nothing)
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # origin/main: a rebuilt tag must be on it
          persist-credentials: false

      # A push: a release only when release-please just made one, on this very commit. By hand: a vX.Y.Z tag on
      # origin/main rebuilds that release; main builds sha-<short> only; anything else stops here.
      - name: Decide
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASED: ${{ needs.release-please.outputs.release_created }}
          RP_TAG: ${{ needs.release-please.outputs.tag }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [ "$GITHUB_REPOSITORY" = jon-lange/settleview ] || { echo "this workflow pushes $IMAGE only"; exit 1; }
          if [ "$EVENT" = push ]; then
            if [ "$RELEASED" != true ]; then
              echo "kind=none" >> "$GITHUB_OUTPUT"
              echo "No release in this push: nothing to build." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [[ "$RP_TAG" =~ $semver ]] || { echo "release-please made $RP_TAG, not vX.Y.Z"; exit 1; }
            [ "$RP_SHA" = "$GITHUB_SHA" ] || { echo "$RP_TAG is on $RP_SHA, not on this run's $GITHUB_SHA"; exit 1; }
            tag="$RP_TAG"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            { echo "kind=main"; echo "version=sha-$short"; echo "tag="; } >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ $semver ]]; then
            tag="$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$tag ($short) is not on origin/main"; exit 1; }
          else
            echo "$GITHUB_REF: the release workflow runs for a vX.Y.Z tag or for main only"
            exit 1
          fi
          { echo "kind=release"; echo "version=${tag#v}"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (linux/amd64 + linux/arm64)
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.kind == 'release' || needs.plan.outputs.kind == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write  # the push to GHCR; this job and the signing job only
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's tags, labels and annotations (docker/metadata-action): X.Y.Z from a vX.Y.Z tag, sha-<short> always,
      # never `latest`; the OCI source / revision / version labels link the package to this repository.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.kind == 'release' }}
            type=sha,prefix=sha-,format=short

      # From scratch (pull, no-cache): the base digest is pinned, and the Dockerfile's `apt-get upgrade` layer then
      # takes the security fixes published up to today, not a cached day's. The digest output is the image index's.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          pull: true
          no-cache: true
          push: true
          provenance: mode=min
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest from the build"; exit 1; }
          { echo "Pushed \`$IMAGE@$DIGEST\`"; echo; echo "$TAGS"; } >> "$GITHUB_STEP_SUMMARY"

  scan:
    # The pushed digest itself, each platform read from GHCR: CI's Trivy gate (fixable HIGH / CRITICAL
    # vulnerabilities and secrets, .trivyignore if any) fails the release before anything is signed. The same run
    # writes each platform's CycloneDX SBOM. Read-only on the package; no OIDC token here.
    name: Trivy (the pushed digest) and SBOMs
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # Trivy reads the private image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # Each platform of the pushed digest, read from GHCR itself (TRIVY_IMAGE_SRC / TRIVY_PLATFORM are Trivy's own
      # settings; the registry credentials by name), with CI's policy; then each platform's CycloneDX SBOM. Trivy
      # reads .trivyignore from the checkout when there is one.
      - name: Trivy scan (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (linux/arm64)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/arm64
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Trivy does not create the output directory (same as CI's SARIF step).
      - name: SBOM output directory
        run: mkdir -p sbom

      - name: SBOM (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: cyclonedx
          output: sbom/settleview-${{ needs.plan.outputs.version }}-linux-amd64.cdx.json

      - name: SBOM (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/arm64
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: cyclonedx
          output: sbom/settleview-${{ needs.plan.outputs.version }}-linux-arm64.cdx.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  sign:
    # Keyless: cosign gets a short-lived certificate for this workflow's OIDC identity
    # (https://github.com/jon-lange/settleview/.github/workflows/release.yml@<ref>: refs/heads/main for a release made
    # by release-please, the tag for a rebuild by hand) from Sigstore's Fulcio and records
    # the signature in the public Rekor log (the identity, the commit and the digest are public there; nothing else).
    # The index digest is signed (what a deploy names), each platform's manifest too, and each platform's SBOM is
    # attested on its manifest. Then the same verify a deploy runs, so a release that cannot be verified fails here.
    name: Sign (cosign keyless) and attest the SBOMs
    needs: [plan, build, scan]
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # the signatures and attestations are stored next to the image
      id-token: write  # GitHub's OIDC token for cosign keyless; this job only
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: sbom
          path: sbom

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image and attest the SBOMs
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          docker buildx imagetools inspect --raw "$ref" > /tmp/index.json
          for arch in amd64 arm64; do
            pd=$(python3 -c 'import json, sys; m = [x["digest"] for x in json.load(open("/tmp/index.json"))["manifests"] if x.get("platform", {}).get("os") == "linux" and x["platform"].get("architecture") == sys.argv[1]]; assert len(m) == 1, m; print(m[0])' "$arch")
            cosign sign --yes "$IMAGE@$pd"
            cosign attest --yes --type cyclonedx --predicate "sbom/settleview-${VERSION}-linux-${arch}.cdx.json" "$IMAGE@$pd"
            echo "linux/$arch: \`$IMAGE@$pd\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # The deploy's own check (docs/operations.md, "Deploy a release"): the identity is this workflow at this ref.
      - name: Verify as a deploy would
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" "$IMAGE@$DIGEST" > /dev/null
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > /tmp/index.json
          pd=$(python3 -c 'import json; print([x["digest"] for x in json.load(open("/tmp/index.json"))["manifests"] if x.get("platform", {}).get("architecture") == "amd64"][0])')
          cosign verify-attestation --type cyclonedx --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" "$IMAGE@$pd" > /dev/null
          echo "Verified: signed by \`$identity\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    # release-please made the Release (the changelog section as its notes); this adds the image: the digest, the
    # verify command and the SBOMs. A rebuild by hand replaces that section and the SBOMs.
    name: GitHub Release (digest, verify command, SBOMs)
    if: ${{ !cancelled() && needs.plan.outputs.kind == 'release' && needs.sign.result == 'success' }}
    needs: [plan, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # edit the Release and upload its assets; this job only
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: sbom
          path: sbom

      - name: Add the image to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          marker='<!-- settleview-image -->'
          ref="$IMAGE:$VERSION@$DIGEST"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          gh release view "$TAG" --json body --jq .body | awk -v m="$marker" '$0 == m { exit } { print }' > /tmp/notes.md
          {
            echo "$marker"
            echo "## Image"
            echo
            echo "\`$ref\` (linux/amd64, linux/arm64; deploy this tag@digest, never the tag alone). Signed with cosign"
            echo "keyless by this repository's release workflow; the CycloneDX SBOMs below are attached to it as"
            echo "attestations too. Verify before deploying (docs/operations.md, \"Releases and deploying by digest\"):"
            echo
            echo '```bash'
            echo "cosign verify $ref \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity $identity"
            echo '```'
          } >> /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
          gh release upload "$TAG" sbom/*.cdx.json --clobber

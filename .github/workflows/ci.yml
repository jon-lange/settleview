name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by full commit SHA (the version in the comment): a moved tag cannot change what runs here.

jobs:
  # The quality gates: every pre-commit hook (.pre-commit-config.yaml: gitleaks over the whole history, Ruff,
  # ShellCheck, hadolint, actionlint, the import contracts) with pre-commit's own action, `pre-commit run --all-files`,
  # directly on the runner: it has Docker, which hadolint's official hook (hadolint-docker) runs, and the dev container
  # deliberately has not (it skips that one hook; the `test` job runs there). Then Trivy (the next job). The `.venv` in
  # the jobs below is the runner's own throwaway environment (uv, Python 3.13 on Linux); locally nothing makes one: the
  # same commands run in the dev container (.devcontainer/, deploy/dev/).
  lint:
    name: Quality gates (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans every commit of the branch, not only the checked-out tree
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.1"  # the uv the Dockerfiles pin

      # uv.lock (every dependency, pinned with sha256 hashes) must match pyproject.toml: a pin changed without
      # `uv lock` fails here, before any install.
      - name: Lock file matches pyproject.toml (uv lock --check)
        run: uv lock --check

      # pre-commit/action runs `python -m pip install pre-commit`, so it needs a Python of its own (its README).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # `pre-commit run --show-diff-on-failure --all-files`; the hook environments are cached by the action.
      - name: pre-commit run --all-files (pre-commit/action)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  trivy:
    # The app image (vulnerabilities with a fix, HIGH and CRITICAL, and secrets), the Dockerfiles' misconfigurations and
    # secrets in the repository, with Aqua's official action at the pinned Trivy; each fails the job on a finding, and
    # .trivyignore (when present: a reason, a date and an expiry per entry) is read from the checkout by Trivy itself.
    # The same scans are then written as SARIF for code scanning where the repo has it (public repos, or private ones
    # with GitHub Advanced Security); an upload refused for lack of it does not fail the job, a finding does.
    name: Trivy (image, config, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # the SARIF upload; this job only
      actions: read  # upload-sarif reads this workflow run (GET .../actions/runs/{id}); a private repo must grant it
    env:
      TRIVY_VERSION: v0.76.0  # the Trivy release the scans run (setup-trivy installs it; the database is cached)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build the image (linux/amd64, as the image job; no push)
        run: |
          docker buildx build --platform linux/amd64 --build-arg GIT_SHA="${{ github.sha }}" --cache-from type=gha             --load -t settleview:trivy .

      - name: Trivy image scan (fixable HIGH / CRITICAL vulnerabilities, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: settleview:trivy
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy config scan (the Dockerfiles; HIGH / CRITICAL)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          skip-dirs: .cache
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy secret scan (repository)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          skip-dirs: .cache
          scanners: secret
          exit-code: "1"

      # Trivy writes `output` into an existing directory only (it does not create one).
      - name: The SARIF directory
        if: success() || failure()
        run: mkdir -p sarif

      - name: SARIF of the image scan (the same scan, for code scanning)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: settleview:trivy
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: sarif/trivy-image.sarif
          limit-severities-for-sarif: true

      - name: SARIF of the config scan
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          skip-dirs: .cache
          severity: HIGH,CRITICAL
          format: sarif
          output: sarif/trivy-config.sarif
          limit-severities-for-sarif: true

      - name: SARIF of the secret scan
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          skip-dirs: .cache,sarif
          scanners: secret
          format: sarif
          output: sarif/trivy-fs.sarif

      - name: Upload the image scan to code scanning
        if: (success() || failure()) && hashFiles('sarif/trivy-image.sarif') != ''
        continue-on-error: true  # a private repo without code scanning refuses the upload; the scan above is the gate
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: sarif/trivy-image.sarif
          category: trivy-image

      - name: Upload the config scan to code scanning
        if: (success() || failure()) && hashFiles('sarif/trivy-config.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: sarif/trivy-config.sarif
          category: trivy-config

      - name: Upload the secret scan to code scanning
        if: (success() || failure()) && hashFiles('sarif/trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: sarif/trivy-fs.sarif
          category: trivy-fs

  test:
    # The whole suite in the dev container developers use (.devcontainer/devcontainer.json -> deploy/dev/compose.yaml:
    # the production base image, every extra from the hashed uv.lock, Playwright's Chromium, so the e2e tests run too),
    # through the official Dev Containers action (it runs @devcontainers/cli: `devcontainer up`, then `exec`).
    # The tests build their own data (fixtures, fakes, in-memory exchanges): no keys, no network, no data/ folder.
    # No BTCFLOW_* settings and no .env exist here, so every Settings() sees its defaults.
    name: Tests (the dev container, Python 3.13, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The action uses an installed `devcontainer` and otherwise installs the newest 0.x: pin the CLI here instead
      # (2026-08-31, older than two weeks when adopted; the version the local headless proof ran).
      - name: Install the Dev Containers CLI (pinned)
        run: npm install -g @devcontainers/cli@0.89.0

      # The OpenTelemetry tests, none may be skipped (the scrubbing tests fail if a
      # token, key, cookie, signature or query secret reaches an exporter; the GenAI one runs the bundled Claude Code
      # CLI against a local fake API); then the whole suite. The collector end-to-end tests (marker collector_e2e) are
      # left out by name, not skipped: they run only beside their throwaway collector and OpenObserve
      # (tests/telemetry/collector_e2e.compose.yaml).
      # The CLI builds the service from a Dockerfile it writes outside the build context (its features layer, in its
      # temp folder). Compose builds through Buildx Bake, which refuses to read a file outside the context without an
      # `--allow=fs.read=...` entitlement that neither Compose nor the CLI passes; BUILDX_BAKE_ENTITLEMENTS_FS=0 is
      # Buildx's documented switch for that check (docs.docker.com, `docker buildx bake`, "--allow"), for this build
      # only. (The CLI's "Could not parse image name" line for the tag@digest FROM is a warning: it pulls by digest and
      # goes on; 0.90.0 fixes it.)
      - name: Tests in the dev container (devcontainers/ci)
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca  # v0.3.1900000450
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        with:
          push: never
          runCmd: |
            set -e
            pytest tests/telemetry -m "not collector_e2e" -rs > /tmp/otel.txt 2>&1 || { cat /tmp/otel.txt; exit 1; }
            cat /tmp/otel.txt
            if grep -q SKIPPED /tmp/otel.txt; then echo "OpenTelemetry tests were skipped"; exit 1; fi
            pytest

  postgres:
    # The whole suite again with the store on Postgres 17 (tests/conftest.py: every test that uses `store` runs there),
    # plus the Postgres-only tests (marked `postgres`): empty -> head on both dialects (G2), the archive, the recorders'
    # research schema, two services migrating at once, the app starting on Postgres, and the SQLite -> Postgres move
    # tool on generated data (G6). The server is the image compose.yaml pins; the password exists only in this job.
    name: Tests on Postgres 17 (full suite, migrations, move tool)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BTCFLOW_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.1"  # the uv the Dockerfiles pin
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Create the Python 3.13 environment
        run: uv venv --python 3.13 .venv

      - name: Install the project, dev tools and the Postgres driver
        run: |
          uv export --locked --extra dev --extra postgres --extra otel --extra evals --no-emit-project --format requirements.txt -o /tmp/requirements.txt
          if ! uv pip install --python .venv --require-hashes --no-deps -r /tmp/requirements.txt; then
            echo "::warning::Install failed (likely no ta-lib wheel); installing the TA-Lib C library and retrying"
            curl -fsSL -o /tmp/ta-lib.deb https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib_0.6.4_amd64.deb
            sudo apt-get install -y /tmp/ta-lib.deb
            uv pip install --python .venv --require-hashes --no-deps -r /tmp/requirements.txt
          fi
          uv pip install --python .venv --no-deps --no-build-isolation -e .

      - name: Postgres-only tests (none may be skipped)
        run: |
          .venv/bin/python -m pytest -p no:cacheprovider -m postgres -rs | tee /tmp/pg.txt
          if grep -q "SKIPPED" /tmp/pg.txt; then echo "Postgres tests were skipped"; exit 1; fi

      - name: The full suite with the store on Postgres
        run: .venv/bin/python -m pytest -p no:cacheprovider

  portable:
    # The supervisor, ops stop, the recorders and the settings run where users run them: Linux, macOS and Windows.
    name: Supervisor and recorders (Python 3.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.1"  # the uv the Dockerfiles pin
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Create the Python 3.13 environment
        run: uv venv --python 3.13 .venv

      - name: Install the project and dev tools
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements.txt -o requirements-ci.txt
          uv pip install --python .venv --require-hashes --no-deps -r requirements-ci.txt
          uv pip install --python .venv --no-deps --no-build-isolation -e .

      - name: Supervisor, ops, recorders and settings tests
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pytest -p no:cacheprovider tests/bootstrap/test_process_supervisor.py tests/bootstrap/test_ops_stop.py tests/recorders tests/test_config.py tests/application/test_recorder_health.py

  image:
    name: Docker image (linux/amd64 + linux/arm64) and compose services (no push, no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_SHA: ${{ github.sha }}  # the image's revision label (compose.yaml's build arg reads it too)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Throwaway passwords for this run (the same script a user runs once); nothing is printed but file names.
      - name: Make the secret files (Postgres, OpenObserve, OTLP headers)
        run: python3 deploy/postgres/make_secrets.py

      # The compose file must resolve with no .env and no BTCFLOW_* variables (every service, healthcheck and volume),
      # with and without the opt-in observability profile.
      - name: Check compose.yaml
        run: |
          docker compose config --quiet
          docker compose --profile observability config --quiet

      # Swarm drops the 127.0.0.1 of a publish, so the stack file must not publish the PC listener (8001), the agent
      # listener (8002) or OpenObserve (5080) at all: the renderer refuses them, and Swarm's own reading of the file
      # (`docker stack config`) is checked again, with and without the observability and tailscale profiles.
      - name: Check the Swarm stack publishes no PC-only port
        run: |
          for profile in "" "--profile observability" "--profile tailscale"; do
            read -ra args <<< "$profile"
            python3 deploy/swarm/render_stack.py "${args[@]}" --out /tmp/settleview-stack.json
            docker stack config -c /tmp/settleview-stack.json > /tmp/settleview-stack.yaml
            if grep -En 'published: "?(8001|8002|5080)"?$' /tmp/settleview-stack.yaml; then
              echo "the Swarm stack publishes a PC-only port"; exit 1
            fi
          done

      # Both architectures the image runs on (Azure Container Apps: amd64; Graviton and other ARM hosts, and ARM
      # dev machines: arm64). arm64 runs under QEMU here: slow, but it installs and imports that platform's wheels.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build the image for linux/amd64 and linux/arm64 (no push)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg GIT_SHA="$GIT_SHA" \
            --cache-to type=gha,mode=max --cache-from type=gha -t settleview:ci .

      - name: Smoke-test the arm64 image (QEMU)
        run: |
          docker buildx build --platform linux/arm64 --build-arg GIT_SHA="$GIT_SHA" --cache-from type=gha --load \
            -t settleview:arm64 .
          docker run --rm --platform linux/arm64 --entrypoint python settleview:arm64 -c "import platform, sys; assert platform.machine() == 'aarch64', platform.machine(); assert sys.version_info[:2] == (3, 13)"
          docker run --rm --platform linux/arm64 --entrypoint python settleview:arm64 -c "import btc_signal_engine.bootstrap.app, opentelemetry.sdk, opentelemetry.exporter.otlp.proto.http"

      - name: Build the image (the one image every compose service uses)
        run: |
          docker buildx build --platform linux/amd64 --build-arg GIT_SHA="$GIT_SHA" --cache-from type=gha --load \
            -t settleview:local .

      # The image's own interpreter and dependencies, without starting the app (no network, no keys, no data).
      - name: Check the image's Python and imports
        run: |
          docker run --rm --entrypoint python settleview:local -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
          docker run --rm --entrypoint python settleview:local -c "import btc_signal_engine.bootstrap.app"
          docker run --rm --entrypoint python settleview:local -c "import opentelemetry.sdk, opentelemetry.exporter.otlp.proto.http, opentelemetry.instrumentation.fastapi"

      - name: Check the image declares a health check and its revision
        run: |
          test "$(docker inspect --format '{{json .Config.Healthcheck.Test}}' settleview:local)" != "null"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' settleview:local)" = "$GIT_SHA"

      # Telemetry is inert without an endpoint, and a bad OTEL_* setting refuses the start (78) instead of falling back.
      - name: Check telemetry's configuration in the image
        run: |
          docker run --rm --network none --entrypoint python settleview:local -c "from btc_signal_engine.bootstrap import telemetry; assert not telemetry.setup('ci').enabled"
          set +e
          docker compose run --rm --no-deps -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:9 -e OTEL_TRACES_EXPORTER=zipkin rec-pm-settle python -m btc_signal_engine.recorders pm-settle
          code=$?
          set -e
          test "$code" = "78" || { echo "a bad OTEL_TRACES_EXPORTER exited $code, expected 78"; exit 1; }

      # Each recorder service's own entry point, in its own service (its env and secrets), without the network:
      # pm-settle's --check passes (it needs no key); pm-quotes refuses with 78 (no key in CI), which is the point.
      - name: Smoke-start each recorder service's entry point
        run: |
          docker compose run --rm --no-deps rec-pm-settle python -m btc_signal_engine.recorders pm-settle --check
          set +e
          docker compose run --rm --no-deps rec-pm-quotes python -m btc_signal_engine.recorders pm-quotes --check
          code=$?
          set -e
          test "$code" = "78" || { echo "pm-quotes --check without keys exited $code, expected 78"; exit 1; }
          docker compose run --rm --no-deps rec-pm-quotes python -m btc_signal_engine.ops fresh --help
          docker compose run --rm --no-deps app python -m btc_signal_engine.supervise --help

      # The named volume takes the image's owner: the non-root app can write to it.
      - name: Check the app's volume is writable by the app user
        run: docker compose run --rm --no-deps --entrypoint python app -c "open('/data/.write-test', 'w').write('ok')"

      # The real stack's database: the init script makes the roles and schemas on a new volume, the app's role migrates,
      # the research role reads but cannot write, the backup service dumps, and the dump restores into a fresh server.
      - name: Postgres roles, migration, backup and restore drill
        run: |
          docker compose up -d --wait postgres
          # the tuned settings, and pg_stat_statements (preloaded by compose.yaml, created by initdb.sh)
          adm() { docker compose exec -T postgres psql -U postgres -d settleview -v ON_ERROR_STOP=1 -At -c "$1"; }
          test "$(adm 'show shared_buffers')" = "512MB"
          test "$(adm "select count(*) from pg_extension where extname = 'pg_stat_statements'")" = "1"
          adm "select count(*) from pg_stat_statements" > /dev/null
          docker compose run --rm --no-deps app python -m btc_signal_engine.ops migrate
          ro() { docker compose exec -T postgres sh -c "PGPASSWORD=\"\$(cat /run/secrets/pg_research_password)\" psql -h localhost -U settleview_research -d settleview -v ON_ERROR_STOP=1 -At -c \"$1\""; }
          test "$(ro 'select count(*) from app.alembic_version')" = "1"
          if ro "create table research.nope (i int)"; then echo "the research role could write"; exit 1; fi
          if ro "delete from app.alembic_version"; then echo "the research role could delete"; exit 1; fi
          # the append-only audit (deploy/postgres/audit.sql at init, sealed by migration 0023): the app role only adds rows
          app() { docker compose exec -T postgres sh -c "PGPASSWORD=\"\$(cat /run/secrets/pg_app_password)\" psql -h localhost -U settleview_app -d settleview -v ON_ERROR_STOP=1 -At -c \"$1\""; }
          test "$(adm "select pg_get_userbyid(relowner) from pg_class where oid = 'app.trading_audit'::regclass")" = "settleview_audit"
          if app "delete from app.trading_audit"; then echo "the app role could delete audit rows"; exit 1; fi
          if app "drop table app.trading_audit"; then echo "the app role could drop the audit"; exit 1; fi
          docker compose run --rm --no-deps backup bash /usr/local/bin/settleview-backup --once
          bash deploy/postgres/restore-drill.sh

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  staging:
    # The deploy gate's first half, as scripts/deploy.py runs it: the image on staging (deploy/staging/: no real-money
    # path), offline (an internal network: no venue, no internet, no key), then the read-only smoke suite (tests/smoke,
    # pytest + Playwright in the dev image, inside the app container's network namespace).
    name: Staging (offline) and the smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SETTLEVIEW_IMAGE: settleview:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the image and the dev image
        run: |
          docker build --build-arg GIT_SHA="${{ github.sha }}" -t settleview:ci .
          docker compose -f deploy/dev/compose.yaml build dev

      - name: Staging up (offline), waiting for every healthcheck
        run: |
          python3 deploy/postgres/make_secrets.py deploy/staging/secrets
          # The images it does not build (postgres), while the daemon can still reach the registry: `up` never pulls.
          docker compose -p settleview-staging --env-file deploy/staging/staging.env -f compose.yaml \
            -f deploy/staging/compose.staging.yaml -f deploy/staging/compose.offline.yaml pull --quiet --ignore-buildable
          docker compose -p settleview-staging --env-file deploy/staging/staging.env -f compose.yaml \
            -f deploy/staging/compose.staging.yaml -f deploy/staging/compose.offline.yaml \
            up -d --wait --wait-timeout 300 --no-build --pull never

      - name: The smoke suite (read-only)
        run: python3 scripts/smoke.py --project settleview-staging

      - name: Staging logs
        if: failure()
        run: docker compose -p settleview-staging -f compose.yaml -f deploy/staging/compose.staging.yaml logs --tail 200

      - name: Stop staging
        if: always()
        run: docker compose -p settleview-staging -f compose.yaml -f deploy/staging/compose.staging.yaml down --volumes

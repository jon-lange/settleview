# Dependabot version updates (security updates are separate and are not delayed by the cooldown or the groups).
# - cooldown: a release must be 14 days old before Dependabot proposes it, matching the project's rule that pinned
#   versions are at least two weeks old (AGENTS.md).
# - groups: one weekly PR per ecosystem for routine (minor/patch) bumps instead of one PR per package.
# - ignore semver-major (and the Python interpreter's minor, e.g. 3.13 -> 3.14): those are deliberate, tested
#   upgrades, not routine bumps.
# Commit messages follow Conventional Commits for release-please.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      compose-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
